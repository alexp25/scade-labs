<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 6 – Software Architecture</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0D1B3E;
      --blue:   #1565C0;
      --sky:    #1E88E5;
      --ice:    #E3F2FD;
      --white:  #FFFFFF;
      --off:    #F5F7FA;
      --muted:  #78909C;
      --orange: #F57C00;
      --green:  #2E7D32;
      --gray:   #455A64;
      --border: #D0D8E8;
      --font:   'Segoe UI', system-ui, sans-serif;
      --mono:   'Consolas', 'Fira Mono', monospace;
      --sidebar-w: 260px;
    }

    html { scroll-behavior: smooth; }
    body { font-family: var(--font); font-size: 15px; color: var(--gray); background: var(--off); line-height: 1.65; }

    /* ── Header ── */
    .page-header {
      background: var(--navy); color: var(--white);
      padding: 2rem; border-bottom: 4px solid var(--sky);
    }
    .page-header h1 { font-size: 1.6rem; font-weight: 700; color: var(--white); }
    .page-header .meta { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: .5rem; font-size: .82rem; color: #90A4AE; }
    .page-header .meta span::before { content: "● "; color: var(--sky); }
    .back-btn {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: .8rem; font-weight: 600; color: #90A4AE;
      border: 1px solid #2A4A7F; border-radius: 5px;
      padding: .3rem .75rem; text-decoration: none;
      margin-bottom: .75rem; transition: color .15s, border-color .15s;
    }
    .back-btn:hover { color: var(--white); border-color: var(--sky); }

    /* ── Body layout: sidebar + content ── */
    .page-body {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      align-items: start;
    }

    /* ── TOC Sidebar ── */
    .toc-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      background: var(--white);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1rem 2rem;
      scrollbar-width: thin;
    }
    .toc-sidebar::-webkit-scrollbar { width: 4px; }
    .toc-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .toc-title {
      font-size: .7rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: .75rem; padding-bottom: .4rem;
      border-bottom: 1px solid var(--border);
    }

    #toc-list { list-style: none; }
    #toc-list li a {
      display: block;
      font-size: .82rem;
      color: var(--gray);
      text-decoration: none;
      padding: .28rem .4rem;
      border-radius: 4px;
      border-left: 2px solid transparent;
      line-height: 1.4;
      transition: color .15s, background .15s, border-color .15s;
    }
    #toc-list li a:hover { color: var(--blue); background: var(--ice); }
    #toc-list li.active > a {
      color: var(--blue); font-weight: 600;
      background: var(--ice); border-left-color: var(--sky);
    }

    /* indent levels */
    #toc-list .toc-h1 a { padding-left: .4rem; font-weight: 600; color: var(--navy); }
    #toc-list .toc-h2 a { padding-left: 1rem; }
    #toc-list .toc-h3 a { padding-left: 1.8rem; font-size: .78rem; color: var(--muted); }

    /* ── Main content ── */
    .content { max-width: 860px; padding: 2rem 2rem 4rem; }

    #lab-content h1 {
      font-size: 1.45rem; font-weight: 700; color: var(--navy);
      margin: 2.5rem 0 .75rem; padding-bottom: .3rem;
      border-bottom: 3px solid var(--sky);
    }
    #lab-content h1:first-child { margin-top: 0; }
    #lab-content h2 {
      font-size: 1.15rem; font-weight: 700; color: var(--navy);
      margin: 2rem 0 .65rem; padding-bottom: .25rem;
      border-bottom: 1px solid var(--border);
    }
    #lab-content h3 { font-size: 1rem; font-weight: 600; color: var(--blue); margin: 1.5rem 0 .45rem; }
    #lab-content p  { margin-bottom: .85rem; }
    #lab-content ul, #lab-content ol { padding-left: 1.4rem; margin-bottom: .85rem; }
    #lab-content li { margin-bottom: .3rem; }
    #lab-content strong { color: var(--navy); }
    #lab-content em { color: var(--muted); }

    #lab-content code {
      font-family: var(--mono); font-size: .88em;
      background: #EEF2F7; padding: .1em .35em;
      border-radius: 3px; color: var(--blue);
    }
    #lab-content pre {
      font-family: var(--mono); font-size: .88rem;
      border-radius: 6px; overflow-x: auto;
      margin: .75rem 0 1rem; line-height: 1.55;
      padding: 0; background: transparent;
    }
    #lab-content pre code { padding: 0; font-size: inherit; background: none; }
    #lab-content pre code.hljs {
      border-radius: 6px; padding: 1rem 1.25rem;
      font-size: .88rem; line-height: 1.55;
      display: block; overflow-x: auto;
    }

    /* ── Diagram editor (interactive Mermaid) ── */
    .diagram-editor {
      margin: .75rem 0 1.25rem; border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; background: var(--white);
    }
    .de-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: .75rem; flex-wrap: wrap;
      background: var(--navy); color: #B0BEC5;
      padding: .55rem .85rem; font-size: .8rem;
    }
    .de-actions { display: flex; gap: .5rem; flex-shrink: 0; }
    .de-btn {
      padding: .32rem .8rem; border-radius: 5px; border: 1px solid #2A4A7F;
      background: transparent; color: var(--white); font-size: .8rem;
      font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s;
    }
    .de-btn:hover { background: var(--sky); border-color: var(--sky); }
    .de-source {
      display: block; width: 100%; box-sizing: border-box;
      font-family: var(--mono); font-size: .85rem; line-height: 1.5;
      color: var(--gray); background: #F8FAFC; border: none;
      border-bottom: 1px solid var(--border);
      padding: .75rem .85rem; resize: vertical; outline: none;
    }
    .de-source:focus { background: var(--white); }
    .de-preview {
      padding: 1rem; overflow-x: auto; text-align: center; min-height: 3rem;
    }
    .de-error {
      margin: 0 .85rem .75rem; padding: .5rem .75rem;
      background: #FFEBEE; color: #B71C1C; border-radius: 5px;
      font-size: .82rem; font-family: var(--mono); white-space: pre-wrap;
    }

    #lab-content blockquote {
      border-left: 4px solid var(--sky); background: var(--ice);
      padding: .85rem 1rem; border-radius: 0 6px 6px 0; margin: 1rem 0;
    }
    #lab-content blockquote p { margin-bottom: 0; }
    #lab-content blockquote strong { color: var(--blue); }

    #lab-content table { width: 100%; border-collapse: collapse; font-size: .9rem; margin: 1rem 0; overflow-x: auto; display: block; }
    #lab-content th { background: var(--navy); color: var(--white); padding: .55rem .75rem; text-align: left; font-weight: 600; }
    #lab-content td { padding: .5rem .75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    #lab-content tr:nth-child(even) td { background: #F8FAFC; }

    #lab-content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    #lab-content img { max-width: 100%; border-radius: 6px; margin: .5rem 0; }

    .loading { color: var(--muted); font-style: italic; padding: 2rem 0; }

    footer { text-align: center; padding: 2rem; font-size: .82rem; color: var(--muted); border-top: 1px solid var(--border); margin-top: 3rem; }

    /* ── Responsive: hide sidebar on small screens ── */
    @media (max-width: 768px) {
      .page-body { grid-template-columns: 1fr; }
      .toc-sidebar { display: none; }
      .content { padding: 1.25rem 1rem 3rem; }
    }
  </style>
</head>
<body>

<header class="page-header">
  <a class="back-btn" href="../">&#8592; All Labs</a>
  <h1>Lab 6 — Software Architecture</h1>
  <div class="meta">
    <span>Software Engineering</span>
    <span>Lesson 6</span>
    <span>1.5 hours</span>
  </div>
  <div style="margin-top:.75rem; display:flex; align-items:center; flex-wrap:wrap; gap:.5rem;">
    <div id="auth-slot" data-base="../"></div>
    <div id="course-slides-slot" data-base="../"></div>
  </div>
</header>

<div class="page-body">
  <nav class="toc-sidebar" aria-label="Table of contents">
    <p class="toc-title">Contents</p>
    <ul id="toc-list"></ul>
  </nav>

  <main class="content">
    <div id="lab-content"><p class="loading">Loading lab content…</p></div>
  </main>
</div>

<footer>Lab 6 · Software Engineering · Software Architecture</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>window.CURRENT_LAB_ID = 'lab6';</script>
<script type="module" src="../assets/js/auth-header.js"></script>
<script src="../assets/js/course-slides.js"></script>
<script>
fetch('lab.md')
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.text();
  })
  .then(md => {
    document.getElementById('lab-content').innerHTML = marked.parse(md);
    document.querySelectorAll('#lab-content pre code').forEach(el => {
      if (el.classList.contains('language-mermaid-edit')) return;
      hljs.highlightElement(el);
    });
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
    }
    buildDiagramEditors();
    buildTOC();
    initScrollSpy();
    initQuiz();
  })
  .catch(err => {
    document.getElementById('lab-content').innerHTML =
      `<p style="color:#B71C1C;padding:1rem 0">
        ⚠ Could not load <code>lab.md</code>: ${err.message}.<br><br>
        Serve the folder locally instead of opening the file directly:<br>
        <code>python -m http.server 8080</code> → then open <code>http://localhost:8080</code>
      </p>`;
  });

/*
 * Every ```mermaid-edit fence (Parts 1-3's hands-on exercise diagrams)
 * becomes a live editor: a textarea with the (intentionally incomplete)
 * diagram source, a Render/Reset toolbar, and a preview pane. Edits are
 * kept per-block in localStorage (client-side only — nothing is uploaded
 * or graded automatically).
 */
function buildDiagramEditors() {
  const blocks = Array.from(document.querySelectorAll('#lab-content pre code.language-mermaid-edit'));
  if (!blocks.length) return;
  blocks.forEach((code, i) => {
    const starter = code.textContent;
    const storageKey = `lab6-diagram-${i}`;
    const widget = buildDiagramEditorWidget(storageKey, starter, i);
    code.closest('pre').replaceWith(widget);
  });
}

function buildDiagramEditorWidget(storageKey, starter, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'diagram-editor';

  const toolbar = document.createElement('div');
  toolbar.className = 'de-toolbar';
  toolbar.innerHTML =
    '<span>Editable diagram — edit the Mermaid source, then Render (Ctrl+Enter also works)</span>' +
    '<span class="de-actions">' +
      '<button type="button" class="de-btn de-render">&#9654; Render</button>' +
      '<button type="button" class="de-btn de-reset">&#8635; Reset</button>' +
    '</span>';

  const textarea = document.createElement('textarea');
  textarea.className = 'de-source';
  textarea.spellcheck = false;
  const lineCount = starter.split('\n').length;
  textarea.rows = Math.min(22, Math.max(6, lineCount + 1));
  let saved = null;
  try { saved = localStorage.getItem(storageKey); } catch (e) { /* storage unavailable — fall back to starter */ }
  textarea.value = saved !== null ? saved : starter;

  const preview = document.createElement('div');
  preview.className = 'de-preview';

  const error = document.createElement('div');
  error.className = 'de-error';
  error.style.display = 'none';

  wrap.appendChild(toolbar);
  wrap.appendChild(textarea);
  wrap.appendChild(preview);
  wrap.appendChild(error);

  let debounceTimer = null;

  function save(src) {
    try { localStorage.setItem(storageKey, src); } catch (e) { /* storage unavailable, edits just won't persist across reloads */ }
  }

  async function render(src) {
    if (!window.mermaid) {
      error.style.display = 'block';
      error.textContent = 'Mermaid failed to load (offline or CDN blocked) — diagram cannot be rendered.';
      return;
    }
    const svgId = `de-svg-${idx}-${Date.now()}-${Math.floor(Math.random() * 1e6)}`;
    try {
      const { svg } = await mermaid.render(svgId, src);
      preview.innerHTML = svg;
      error.style.display = 'none';
      error.textContent = '';
    } catch (e) {
      error.style.display = 'block';
      error.textContent = 'Diagram error: ' + (e && e.message ? e.message : e);
      const stray = document.getElementById(svgId);
      if (stray) stray.remove();
    }
  }

  toolbar.querySelector('.de-render').addEventListener('click', () => {
    save(textarea.value);
    render(textarea.value);
  });
  toolbar.querySelector('.de-reset').addEventListener('click', () => {
    try { localStorage.removeItem(storageKey); } catch (e) { /* ignore */ }
    textarea.value = starter;
    render(starter);
  });
  textarea.addEventListener('input', () => {
    save(textarea.value);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => render(textarea.value), 700);
  });
  textarea.addEventListener('keydown', ev => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
      ev.preventDefault();
      save(textarea.value);
      render(textarea.value);
    }
  });

  render(textarea.value);
  return wrap;
}

function initQuiz() {
  const submitBtn = document.getElementById('quiz-submit');
  const resetBtn  = document.getElementById('quiz-reset');
  if (!submitBtn) return;

  submitBtn.addEventListener('click', function () {
    const questions = document.querySelectorAll('#architecture-quiz .quiz-q');
    let score = 0;
    let unanswered = 0;

    questions.forEach((q, i) => {
      const correct  = q.dataset.correct;
      const selected = q.querySelector(`input[name="q${i + 1}"]:checked`);
      if (!selected) { unanswered++; return; }

      q.querySelectorAll('.quiz-option').forEach(opt => {
        const val = opt.querySelector('input').value;
        if (val === correct && val === selected.value) {
          opt.classList.add('correct'); score++;
        } else if (val === selected.value) {
          opt.classList.add('wrong');
        } else if (val === correct) {
          opt.classList.add('reveal');
        }
        opt.style.pointerEvents = 'none';
      });
    });

    const scoreEl = document.getElementById('quiz-score');
    if (unanswered) {
      scoreEl.textContent = `Please answer all ${unanswered} remaining question${unanswered > 1 ? 's' : ''}.`;
      scoreEl.style.color = 'var(--orange)';
      return;
    }

    const total = questions.length;
    scoreEl.textContent = `${score} / ${total} correct`;
    scoreEl.style.color = score === total ? 'var(--green)' : score >= Math.ceil(total / 2) ? 'var(--orange)' : '#B71C1C';
    submitBtn.disabled = true;
    resetBtn.style.display = 'inline-block';

    if (window.recordQuizAttempt) {
      window.recordQuizAttempt('lab6', 'architecture-quiz', score, total);
    }
  });

  resetBtn.addEventListener('click', function () {
    document.querySelectorAll('#architecture-quiz .quiz-q').forEach(q => {
      q.querySelectorAll('.quiz-option').forEach(opt => {
        opt.classList.remove('correct', 'wrong', 'reveal');
        opt.style.pointerEvents = '';
        opt.querySelector('input').checked = false;
      });
    });
    document.getElementById('quiz-score').textContent = '';
    submitBtn.disabled = false;
    resetBtn.style.display = 'none';
  });
}

function slugify(text) {
  return text.toLowerCase()
    .replace(/[^\w\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function buildTOC() {
  const headings = document.querySelectorAll('#lab-content h1, #lab-content h2, #lab-content h3');
  const tocList  = document.getElementById('toc-list');
  const slugCount = {};

  headings.forEach(h => {
    const base = slugify(h.textContent);
    slugCount[base] = (slugCount[base] || 0) + 1;
    const slug = slugCount[base] > 1 ? `${base}-${slugCount[base]}` : base;
    h.id = slug;

    const li  = document.createElement('li');
    li.className = `toc-${h.tagName.toLowerCase()}`;
    li.dataset.id = slug;

    const a = document.createElement('a');
    a.href = `#${slug}`;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });
}

function initScrollSpy() {
  const items = Array.from(document.querySelectorAll('#toc-list li'));
  if (!items.length) return;

  const headingEls = items.map(li => document.getElementById(li.dataset.id)).filter(Boolean);

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        items.forEach(li => li.classList.remove('active'));
        const active = items.find(li => li.dataset.id === entry.target.id);
        if (active) {
          active.classList.add('active');
          active.scrollIntoView({ block: 'nearest' });
        }
      }
    });
  }, { rootMargin: '0px 0px -70% 0px', threshold: 0 });

  headingEls.forEach(el => observer.observe(el));
}
</script>

</body>
</html>
