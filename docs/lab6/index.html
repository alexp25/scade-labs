<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 6 – Software Architecture</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0D1B3E;
      --blue:   #1565C0;
      --sky:    #1E88E5;
      --ice:    #E3F2FD;
      --white:  #FFFFFF;
      --off:    #F5F7FA;
      --muted:  #78909C;
      --orange: #F57C00;
      --green:  #2E7D32;
      --gray:   #455A64;
      --border: #D0D8E8;
      --font:   'Segoe UI', system-ui, sans-serif;
      --mono:   'Consolas', 'Fira Mono', monospace;
      --sidebar-w: 260px;
    }

    html { scroll-behavior: smooth; }
    body { font-family: var(--font); font-size: 15px; color: var(--gray); background: var(--off); line-height: 1.65; }

    /* ── Header ── */
    .page-header {
      background: var(--navy); color: var(--white);
      padding: 2rem; border-bottom: 4px solid var(--sky);
    }
    .page-header h1 { font-size: 1.6rem; font-weight: 700; color: var(--white); }
    .page-header .meta { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: .5rem; font-size: .82rem; color: #90A4AE; }
    .page-header .meta span::before { content: "● "; color: var(--sky); }
    .back-btn {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: .8rem; font-weight: 600; color: #90A4AE;
      border: 1px solid #2A4A7F; border-radius: 5px;
      padding: .3rem .75rem; text-decoration: none;
      margin-bottom: .75rem; transition: color .15s, border-color .15s;
    }
    .back-btn:hover { color: var(--white); border-color: var(--sky); }

    /* ── Body layout: sidebar + content ── */
    .page-body {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      align-items: start;
    }

    /* ── TOC Sidebar ── */
    .toc-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      background: var(--white);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1rem 2rem;
      scrollbar-width: thin;
    }
    .toc-sidebar::-webkit-scrollbar { width: 4px; }
    .toc-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .toc-title {
      font-size: .7rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: .75rem; padding-bottom: .4rem;
      border-bottom: 1px solid var(--border);
    }

    #toc-list { list-style: none; }
    #toc-list li a {
      display: block;
      font-size: .82rem;
      color: var(--gray);
      text-decoration: none;
      padding: .28rem .4rem;
      border-radius: 4px;
      border-left: 2px solid transparent;
      line-height: 1.4;
      transition: color .15s, background .15s, border-color .15s;
    }
    #toc-list li a:hover { color: var(--blue); background: var(--ice); }
    #toc-list li.active > a {
      color: var(--blue); font-weight: 600;
      background: var(--ice); border-left-color: var(--sky);
    }

    /* indent levels */
    #toc-list .toc-h1 a { padding-left: .4rem; font-weight: 600; color: var(--navy); }
    #toc-list .toc-h2 a { padding-left: 1rem; }
    #toc-list .toc-h3 a { padding-left: 1.8rem; font-size: .78rem; color: var(--muted); }

    /* ── Main content ── */
    .content { max-width: 860px; padding: 2rem 2rem 4rem; }

    #lab-content h1 {
      font-size: 1.45rem; font-weight: 700; color: var(--navy);
      margin: 2.5rem 0 .75rem; padding-bottom: .3rem;
      border-bottom: 3px solid var(--sky);
    }
    #lab-content h1:first-child { margin-top: 0; }
    #lab-content h2 {
      font-size: 1.15rem; font-weight: 700; color: var(--navy);
      margin: 2rem 0 .65rem; padding-bottom: .25rem;
      border-bottom: 1px solid var(--border);
    }
    #lab-content h3 { font-size: 1rem; font-weight: 600; color: var(--blue); margin: 1.5rem 0 .45rem; }
    #lab-content p  { margin-bottom: .85rem; }
    #lab-content ul, #lab-content ol { padding-left: 1.4rem; margin-bottom: .85rem; }
    #lab-content li { margin-bottom: .3rem; }
    #lab-content strong { color: var(--navy); }
    #lab-content em { color: var(--muted); }

    #lab-content code {
      font-family: var(--mono); font-size: .88em;
      background: #EEF2F7; padding: .1em .35em;
      border-radius: 3px; color: var(--blue);
    }
    #lab-content pre {
      font-family: var(--mono); font-size: .88rem;
      border-radius: 6px; overflow-x: auto;
      margin: .75rem 0 1rem; line-height: 1.55;
      padding: 0; background: transparent;
    }
    #lab-content pre code { padding: 0; font-size: inherit; background: none; }
    #lab-content pre code.hljs {
      border-radius: 6px; padding: 1rem 1.25rem;
      font-size: .88rem; line-height: 1.55;
      display: block; overflow-x: auto;
    }

    /* ── Diagram editor (interactive Drawflow canvas) ── */
    .flow-editor {
      margin: .75rem 0 1.25rem; border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; background: var(--white);
    }
    .flow-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: .75rem; flex-wrap: wrap;
      background: var(--navy); color: #B0BEC5;
      padding: .55rem .85rem; font-size: .8rem;
    }
    .flow-actions, .flow-zoom { display: flex; gap: .5rem; flex-shrink: 0; align-items: center; }
    .flow-btn {
      padding: .32rem .8rem; border-radius: 5px; border: 1px solid #2A4A7F;
      background: transparent; color: var(--white); font-size: .8rem;
      font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s;
    }
    .flow-btn:hover { background: var(--sky); border-color: var(--sky); }
    .flow-zoom-label { min-width: 3.4rem; }
    .flow-canvas-wrap { position: relative; width: 100%; background: #F8FAFC; }
    .flow-canvas { width: 100%; height: 100%; }

    /* Minimap overview, bottom-right corner of the canvas */
    .flow-minimap {
      position: absolute; right: 10px; bottom: 10px; width: 150px; height: 110px;
      background: rgba(255,255,255,.92); border: 1px solid var(--border); border-radius: 6px;
      box-shadow: 0 2px 8px rgba(13,27,62,.18); overflow: hidden; z-index: 5;
      cursor: grab; touch-action: none; user-select: none;
    }
    .flow-minimap.flow-minimap-dragging { cursor: grabbing; }
    .flow-minimap-node {
      position: absolute; background: var(--sky); border-radius: 2px; opacity: .8;
      pointer-events: none;
    }
    .flow-minimap-viewport {
      position: absolute; border: 1.5px solid var(--navy); background: rgba(21,101,192,.08);
      pointer-events: none; transition: none;
    }
    .flow-result {
      padding: .65rem .85rem; font-size: .85rem; border-top: 1px solid var(--border);
      background: var(--white); color: var(--gray); min-height: 1.2rem;
    }
    .flow-result:empty { padding: 0; border-top: none; }
    .flow-result.flow-result-good { background: #E8F5E9; color: #1B5E20; }
    .flow-result.flow-result-bad  { background: #FFF8E1; color: #7A4B00; }
    .flow-result .flow-missing, .flow-result .flow-extra { margin-top: .3rem; font-size: .82rem; }

    /* Drawflow node theme, matching the rest of the page */
    .drawflow .drawflow-node {
      background: var(--white); border: 1.5px solid var(--sky); border-radius: 7px;
      padding: .5rem .65rem; width: auto; min-width: 140px; max-width: 190px;
      box-shadow: 0 1px 4px rgba(13,27,62,.12);
    }
    .drawflow .drawflow-node.selected { border-color: var(--navy); box-shadow: 0 0 0 2px rgba(21,101,192,.25); }
    .drawflow .drawflow-node .flow-node-label {
      font-size: .76rem; font-weight: 600; color: var(--navy); text-align: center; line-height: 1.3;
      pointer-events: none;
    }
    .drawflow .connection .main-path { stroke: var(--blue); stroke-width: 2.5px; }
    .drawflow .connection .main-path:hover { stroke: var(--sky); cursor: pointer; }
    .drawflow .drawflow-node .input, .drawflow .drawflow-node .output {
      background: var(--sky); border: 2px solid var(--white); box-shadow: 0 0 0 1px var(--sky);
    }

    #lab-content blockquote {
      border-left: 4px solid var(--sky); background: var(--ice);
      padding: .85rem 1rem; border-radius: 0 6px 6px 0; margin: 1rem 0;
    }
    #lab-content blockquote p { margin-bottom: 0; }
    #lab-content blockquote strong { color: var(--blue); }

    #lab-content table { width: 100%; border-collapse: collapse; font-size: .9rem; margin: 1rem 0; overflow-x: auto; display: block; }
    #lab-content th { background: var(--navy); color: var(--white); padding: .55rem .75rem; text-align: left; font-weight: 600; }
    #lab-content td { padding: .5rem .75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    #lab-content tr:nth-child(even) td { background: #F8FAFC; }

    #lab-content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    #lab-content img { max-width: 100%; border-radius: 6px; margin: .5rem 0; }

    .loading { color: var(--muted); font-style: italic; padding: 2rem 0; }

    footer { text-align: center; padding: 2rem; font-size: .82rem; color: var(--muted); border-top: 1px solid var(--border); margin-top: 3rem; }

    /* ── Responsive: hide sidebar on small screens ── */
    @media (max-width: 768px) {
      .page-body { grid-template-columns: 1fr; }
      .toc-sidebar { display: none; }
      .content { padding: 1.25rem 1rem 3rem; }
    }
  </style>
</head>
<body>

<header class="page-header">
  <a class="back-btn" href="../">&#8592; All Labs</a>
  <h1>Lab 6 — Software Architecture</h1>
  <div class="meta">
    <span>Software Engineering</span>
    <span>Lesson 6</span>
    <span>1.5 hours</span>
  </div>
  <div style="margin-top:.75rem; display:flex; align-items:center; flex-wrap:wrap; gap:.5rem;">
    <div id="auth-slot" data-base="../"></div>
    <div id="course-slides-slot" data-base="../"></div>
  </div>
</header>

<div class="page-body">
  <nav class="toc-sidebar" aria-label="Table of contents">
    <p class="toc-title">Contents</p>
    <ul id="toc-list"></ul>
  </nav>

  <main class="content">
    <div id="lab-content"><p class="loading">Loading lab content…</p></div>
  </main>
</div>

<footer>Lab 6 · Software Engineering · Software Architecture</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.js"></script>
<script>window.CURRENT_LAB_ID = 'lab6';</script>
<script type="module" src="../assets/js/auth-header.js"></script>
<script src="../assets/js/course-slides.js"></script>
<script>
fetch('lab.md')
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.text();
  })
  .then(md => {
    document.getElementById('lab-content').innerHTML = marked.parse(md);
    document.querySelectorAll('#lab-content pre code').forEach(el => {
      if (el.classList.contains('language-flowgraph')) return;
      hljs.highlightElement(el);
    });
    buildFlowEditors();
    buildTOC();
    initScrollSpy();
    initQuiz();
  })
  .catch(err => {
    document.getElementById('lab-content').innerHTML =
      `<p style="color:#B71C1C;padding:1rem 0">
        ⚠ Could not load <code>lab.md</code>: ${err.message}.<br><br>
        Serve the folder locally instead of opening the file directly:<br>
        <code>python -m http.server 8080</code> → then open <code>http://localhost:8080</code>
      </p>`;
  });

/*
 * Every ```flowgraph fence (Parts 1-2's hands-on exercise diagrams) becomes
 * a live Drawflow canvas: the component boxes are pre-placed from the
 * fence's JSON config, with no connections — drawing the connections is
 * the exercise. A "Check" button auto-grades the student's connections
 * against the config's "expected" edge list (by node key, not by Drawflow's
 * internal numeric ids or port index — see buildFlowEditorWidget). Layout +
 * connections persist per-diagram in localStorage (always, regardless of
 * sign-in). Each Check click also reports the score to the student's
 * account via window.recordQuizAttempt(), same as the #architecture-quiz —
 * a no-op if nobody is signed in (see docs/assets/js/auth-header.js).
 */
function buildFlowEditors() {
  const blocks = Array.from(document.querySelectorAll('#lab-content pre code.language-flowgraph'));
  blocks.forEach((code, i) => {
    let config;
    try {
      config = JSON.parse(code.textContent);
    } catch (e) {
      code.closest('pre').insertAdjacentHTML('afterend',
        '<p style="color:#B71C1C">⚠ Could not parse diagram config: ' + (e && e.message ? e.message : e) + '</p>');
      return;
    }
    buildFlowEditorWidget(code.closest('pre'), `lab6-flow-${i}`, config, i);
  });
}

function buildFlowEditorWidget(preEl, storageKey, config, diagramIndex) {
  const wrap = document.createElement('div');
  wrap.className = 'flow-editor';

  const toolbar = document.createElement('div');
  toolbar.className = 'flow-toolbar';
  toolbar.innerHTML =
    '<span>Drag from the dot on a box\'s right edge to a dot on another box\'s left edge to connect them.</span>' +
    '<span class="flow-zoom">' +
      '<button type="button" class="flow-btn flow-zoom-out" title="Zoom out">&#8722;</button>' +
      '<button type="button" class="flow-btn flow-zoom-label" title="Reset zoom">100%</button>' +
      '<button type="button" class="flow-btn flow-zoom-in" title="Zoom in">&#43;</button>' +
    '</span>' +
    '<span class="flow-actions">' +
      '<button type="button" class="flow-btn flow-check">&#10003; Check</button>' +
      '<button type="button" class="flow-btn flow-reset">&#8635; Reset</button>' +
    '</span>';

  const canvasWrap = document.createElement('div');
  canvasWrap.className = 'flow-canvas-wrap';
  canvasWrap.style.height = (config.height || 460) + 'px';
  const canvas = document.createElement('div');
  canvas.className = 'flow-canvas drawflow';
  canvasWrap.appendChild(canvas);

  const minimap = document.createElement('div');
  minimap.className = 'flow-minimap';
  minimap.title = 'Click or drag to pan the diagram';
  const minimapViewport = document.createElement('div');
  minimapViewport.className = 'flow-minimap-viewport';
  minimap.appendChild(minimapViewport);
  canvasWrap.appendChild(minimap);

  const result = document.createElement('div');
  result.className = 'flow-result';

  wrap.appendChild(toolbar);
  wrap.appendChild(canvasWrap);
  wrap.appendChild(result);

  // Attach to the document before initializing Drawflow — it reads the
  // container's actual layout box, which is unreliable on a detached node.
  preEl.replaceWith(wrap);

  if (!window.Drawflow) {
    result.textContent = 'The diagram tool failed to load (offline or CDN blocked) — connections cannot be drawn here.';
    result.classList.add('flow-result-bad');
    return;
  }

  const editor = new Drawflow(canvas);
  editor.reroute = true;
  editor.force_first_input = false;
  editor.start();

  function addAllNodes() {
    config.nodes.forEach(n => {
      const label = String(n.label).split('\n').map(escapeHtml).join('<br>');
      editor.addNode(n.key, 1, 1, n.x, n.y, 'flow-node', { key: n.key },
        '<div class="flow-node-label">' + label + '</div>', false);
    });
  }

  let saved = null;
  try { saved = localStorage.getItem(storageKey); } catch (e) { /* storage unavailable */ }
  if (saved) {
    try { editor.import(JSON.parse(saved)); } catch (e) { addAllNodes(); }
  } else {
    addAllNodes();
  }

  function exportedData() {
    return editor.export().drawflow.Home.data;
  }

  function idToKeyMap() {
    const data = exportedData();
    const map = {};
    Object.keys(data).forEach(id => { map[id] = data[id].data && data[id].data.key; });
    return map;
  }

  // Every connection is read off each node's own `outputs[...].connections`
  // list, where each entry's `node` field is the *target* node's id — this
  // is Drawflow's own export shape, not something this widget invents.
  function currentPairs() {
    const data = exportedData();
    const map = idToKeyMap();
    const pairs = new Set();
    Object.keys(data).forEach(id => {
      const outputs = data[id].outputs || {};
      Object.keys(outputs).forEach(outKey => {
        (outputs[outKey].connections || []).forEach(conn => {
          const fromKey = map[id];
          const toKey = map[conn.node];
          if (fromKey && toKey) pairs.add(fromKey + '→' + toKey);
        });
      });
    });
    return pairs;
  }

  function persist() {
    try { localStorage.setItem(storageKey, JSON.stringify(editor.export())); } catch (e) { /* storage unavailable */ }
  }

  // Assumed on-screen node footprint (Drawflow doesn't report rendered
  // size in export data) — only used to pad the minimap's bounding box.
  const NODE_W = 190, NODE_H = 60;

  function nodeBounds() {
    const data = exportedData();
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    Object.keys(data).forEach(id => {
      const n = data[id];
      minX = Math.min(minX, n.pos_x);
      minY = Math.min(minY, n.pos_y);
      maxX = Math.max(maxX, n.pos_x + NODE_W);
      maxY = Math.max(maxY, n.pos_y + NODE_H);
    });
    if (!isFinite(minX)) { minX = 0; minY = 0; maxX = NODE_W; maxY = NODE_H; }
    return { minX, minY, w: maxX - minX, h: maxY - minY };
  }

  function redrawMinimap() {
    const mmW = minimap.clientWidth, mmH = minimap.clientHeight;
    if (!mmW || !mmH) return;
    const b = nodeBounds();
    const pad = 24;
    const scale = Math.min(mmW / (b.w + pad * 2), mmH / (b.h + pad * 2));
    const offsetX = (mmW - (b.w + pad * 2) * scale) / 2 - (b.minX - pad) * scale;
    const offsetY = (mmH - (b.h + pad * 2) * scale) / 2 - (b.minY - pad) * scale;

    minimap.querySelectorAll('.flow-minimap-node').forEach(el => el.remove());
    const data = exportedData();
    Object.keys(data).forEach(id => {
      const n = data[id];
      const dot = document.createElement('div');
      dot.className = 'flow-minimap-node';
      dot.style.left = (n.pos_x * scale + offsetX) + 'px';
      dot.style.top = (n.pos_y * scale + offsetY) + 'px';
      dot.style.width = Math.max(4, NODE_W * scale) + 'px';
      dot.style.height = Math.max(3, NODE_H * scale) + 'px';
      minimap.insertBefore(dot, minimapViewport);
    });

    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const vx0 = -editor.canvas_x / editor.zoom;
    const vy0 = -editor.canvas_y / editor.zoom;
    const vw = cw / editor.zoom;
    const vh = ch / editor.zoom;
    minimapViewport.style.left = (vx0 * scale + offsetX) + 'px';
    minimapViewport.style.top = (vy0 * scale + offsetY) + 'px';
    minimapViewport.style.width = Math.max(2, vw * scale) + 'px';
    minimapViewport.style.height = Math.max(2, vh * scale) + 'px';

    minimap.dataset.scale = String(scale);
    minimap.dataset.offsetX = String(offsetX);
    minimap.dataset.offsetY = String(offsetY);
  }

  // Click-or-drag anywhere on the minimap to pan the main canvas there,
  // continuously while the pointer moves (not just on release). Drawflow
  // has no public "pan to" API — this writes to the same two properties
  // and reapplies the same transform string zoom_refresh() itself uses
  // (verified against Drawflow 0.0.60's own source), not an undocumented
  // hack. rAF-batched so a fast mousemove/touchmove stream can't queue up
  // more redraws than the browser can actually paint.
  let panRaf = null;
  let pendingPanEvent = null;

  function panToClientPoint(clientX, clientY) {
    const rect = minimap.getBoundingClientRect();
    const scale = parseFloat(minimap.dataset.scale || '1');
    const offsetX = parseFloat(minimap.dataset.offsetX || '0');
    const offsetY = parseFloat(minimap.dataset.offsetY || '0');
    const posX = ((clientX - rect.left) - offsetX) / scale;
    const posY = ((clientY - rect.top) - offsetY) / scale;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    editor.canvas_x = cw / 2 - posX * editor.zoom;
    editor.canvas_y = ch / 2 - posY * editor.zoom;
    editor.precanvas.style.transform =
      'translate(' + editor.canvas_x + 'px, ' + editor.canvas_y + 'px) scale(' + editor.zoom + ')';
    redrawMinimap();
  }

  function flushPan() {
    panRaf = null;
    if (pendingPanEvent) {
      panToClientPoint(pendingPanEvent.clientX, pendingPanEvent.clientY);
      pendingPanEvent = null;
    }
  }

  function schedulePan(ev) {
    pendingPanEvent = ev;
    if (panRaf === null) panRaf = requestAnimationFrame(flushPan);
  }

  minimap.addEventListener('pointerdown', ev => {
    minimap.setPointerCapture(ev.pointerId);
    minimap.classList.add('flow-minimap-dragging');
    panToClientPoint(ev.clientX, ev.clientY); // jump immediately, don't wait for the first move
  });
  minimap.addEventListener('pointermove', ev => {
    if (ev.buttons === 0) return; // not currently pressed/dragging
    schedulePan(ev);
  });
  function endMinimapDrag(ev) {
    minimap.classList.remove('flow-minimap-dragging');
    try { minimap.releasePointerCapture(ev.pointerId); } catch (e) { /* already released */ }
  }
  minimap.addEventListener('pointerup', endMinimapDrag);
  minimap.addEventListener('pointercancel', endMinimapDrag);

  const quizId = 'diagram-' + (diagramIndex + 1);

  function check() {
    const have = currentPairs();
    const expectedPairs = config.expected.map(p => p[0] + '→' + p[1]);
    const missing = expectedPairs.filter(p => !have.has(p));
    const extra = Array.from(have).filter(p => expectedPairs.indexOf(p) === -1);
    const correctCount = expectedPairs.length - missing.length;

    let html = '<strong>' + correctCount + ' / ' + expectedPairs.length + ' expected connections found.</strong>';
    if (missing.length) {
      html += '<div class="flow-missing">Still missing: ' + missing.join(', ') + '</div>';
    }
    if (extra.length) {
      html += '<div class="flow-extra">Not expected — double-check these: ' + extra.join(', ') + '</div>';
    }
    result.innerHTML = html;
    result.classList.toggle('flow-result-good', missing.length === 0 && extra.length === 0);
    result.classList.toggle('flow-result-bad', missing.length > 0 || extra.length > 0);

    // Tracked exactly like the #architecture-quiz: recorded on every Check
    // click (so an instructor sees the student's progression, not just a
    // final snapshot), a no-op if nobody is signed in.
    if (window.recordQuizAttempt) {
      window.recordQuizAttempt('lab6', quizId, correctCount, expectedPairs.length);
    }
  }

  const zoomLabel = toolbar.querySelector('.flow-zoom-label');

  editor.on('connectionCreated', () => { persist(); redrawMinimap(); });
  editor.on('connectionRemoved', () => { persist(); redrawMinimap(); });
  editor.on('nodeMoved', () => { persist(); redrawMinimap(); });
  editor.on('translate', redrawMinimap);
  editor.on('zoom', z => {
    zoomLabel.textContent = Math.round(z * 100) + '%';
    redrawMinimap();
  });

  toolbar.querySelector('.flow-check').addEventListener('click', check);
  toolbar.querySelector('.flow-zoom-out').addEventListener('click', () => editor.zoom_out());
  toolbar.querySelector('.flow-zoom-in').addEventListener('click', () => editor.zoom_in());
  zoomLabel.addEventListener('click', () => editor.zoom_reset());
  toolbar.querySelector('.flow-reset').addEventListener('click', () => {
    try { localStorage.removeItem(storageKey); } catch (e) { /* ignore */ }
    editor.clear();
    addAllNodes();
    editor.zoom = 1;
    editor.zoom_last_value = 1;
    editor.canvas_x = 0;
    editor.canvas_y = 0;
    editor.precanvas.style.transform = 'translate(0px, 0px) scale(1)';
    zoomLabel.textContent = '100%';
    result.innerHTML = '';
    result.classList.remove('flow-result-good', 'flow-result-bad');
    redrawMinimap();
  });

  redrawMinimap();
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function initQuiz() {
  const submitBtn = document.getElementById('quiz-submit');
  const resetBtn  = document.getElementById('quiz-reset');
  if (!submitBtn) return;

  submitBtn.addEventListener('click', function () {
    const questions = document.querySelectorAll('#architecture-quiz .quiz-q');
    let score = 0;
    let unanswered = 0;

    questions.forEach((q, i) => {
      const correct  = q.dataset.correct;
      const selected = q.querySelector(`input[name="q${i + 1}"]:checked`);
      if (!selected) { unanswered++; return; }

      q.querySelectorAll('.quiz-option').forEach(opt => {
        const val = opt.querySelector('input').value;
        if (val === correct && val === selected.value) {
          opt.classList.add('correct'); score++;
        } else if (val === selected.value) {
          opt.classList.add('wrong');
        } else if (val === correct) {
          opt.classList.add('reveal');
        }
        opt.style.pointerEvents = 'none';
      });
    });

    const scoreEl = document.getElementById('quiz-score');
    if (unanswered) {
      scoreEl.textContent = `Please answer all ${unanswered} remaining question${unanswered > 1 ? 's' : ''}.`;
      scoreEl.style.color = 'var(--orange)';
      return;
    }

    const total = questions.length;
    scoreEl.textContent = `${score} / ${total} correct`;
    scoreEl.style.color = score === total ? 'var(--green)' : score >= Math.ceil(total / 2) ? 'var(--orange)' : '#B71C1C';
    submitBtn.disabled = true;
    resetBtn.style.display = 'inline-block';

    if (window.recordQuizAttempt) {
      window.recordQuizAttempt('lab6', 'architecture-quiz', score, total);
    }
  });

  resetBtn.addEventListener('click', function () {
    document.querySelectorAll('#architecture-quiz .quiz-q').forEach(q => {
      q.querySelectorAll('.quiz-option').forEach(opt => {
        opt.classList.remove('correct', 'wrong', 'reveal');
        opt.style.pointerEvents = '';
        opt.querySelector('input').checked = false;
      });
    });
    document.getElementById('quiz-score').textContent = '';
    submitBtn.disabled = false;
    resetBtn.style.display = 'none';
  });
}

function slugify(text) {
  return text.toLowerCase()
    .replace(/[^\w\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function buildTOC() {
  const headings = document.querySelectorAll('#lab-content h1, #lab-content h2, #lab-content h3');
  const tocList  = document.getElementById('toc-list');
  const slugCount = {};

  headings.forEach(h => {
    const base = slugify(h.textContent);
    slugCount[base] = (slugCount[base] || 0) + 1;
    const slug = slugCount[base] > 1 ? `${base}-${slugCount[base]}` : base;
    h.id = slug;

    const li  = document.createElement('li');
    li.className = `toc-${h.tagName.toLowerCase()}`;
    li.dataset.id = slug;

    const a = document.createElement('a');
    a.href = `#${slug}`;
    a.textContent = h.textContent;
    li.appendChild(a);
    tocList.appendChild(li);
  });
}

function initScrollSpy() {
  const items = Array.from(document.querySelectorAll('#toc-list li'));
  if (!items.length) return;

  const headingEls = items.map(li => document.getElementById(li.dataset.id)).filter(Boolean);

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        items.forEach(li => li.classList.remove('active'));
        const active = items.find(li => li.dataset.id === entry.target.id);
        if (active) {
          active.classList.add('active');
          active.scrollIntoView({ block: 'nearest' });
        }
      }
    });
  }, { rootMargin: '0px 0px -70% 0px', threshold: 0 });

  headingEls.forEach(el => observer.observe(el));
}
