<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — SCADE Lab Portfolio</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0D1B3E;
      --blue: #1565C0;
      --sky: #1E88E5;
      --ice: #E3F2FD;
      --white: #FFFFFF;
      --off: #F5F7FA;
      --muted: #78909C;
      --gray: #455A64;
      --border: #D0D8E8;
      --green: #2E7D32;
      --font: 'Segoe UI', system-ui, sans-serif;
      --mono: 'Consolas', 'Fira Mono', monospace;
    }

    body {
      font-family: var(--font); font-size: 15px; color: var(--gray);
      background: var(--off); line-height: 1.65; min-height: 100vh;
    }

    .page-header { background: var(--navy); color: var(--white); padding: 2rem; border-bottom: 4px solid var(--sky); }
    .page-header h1 { font-size: 1.6rem; font-weight: 700; color: var(--white); }
    .back-btn {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: .8rem; font-weight: 600; color: #90A4AE;
      border: 1px solid #2A4A7F; border-radius: 5px;
      padding: .3rem .75rem; text-decoration: none;
      margin-bottom: .75rem; transition: color .15s, border-color .15s;
    }
    .back-btn:hover { color: var(--white); border-color: var(--sky); }

    .page-content { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 1.75rem; overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: .87rem; }
    th { background: var(--navy); color: var(--white); padding: .5rem .65rem; text-align: left; font-weight: 600; }
    td { padding: .5rem .65rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:nth-child(even) td { background: #F8FAFC; }

    .muted { color: var(--muted); font-size: .87rem; }
    .error { color: #B71C1C; }

    .pill { display: inline-block; font-size: .76rem; background: var(--ice); color: var(--blue); border-radius: 12px; padding: .1rem .55rem; margin: .1rem .2rem .1rem 0; }
  </style>
</head>
<body>

<header class="page-header">
  <a class="back-btn" href="../">&#8592; All Labs</a>
  <h1>Admin — Student Progress</h1>
</header>

<main class="page-content">
  <div class="card">
    <div id="admin-content"><p class="muted">Loading…</p></div>
  </div>
</main>

<script type="module">
import { auth, db } from "../assets/js/firebase-client.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const LAB_TITLES = {
  lab2: "Lab 2",
  lab3_1: "Lab 3.1",
  lab3_2: "Lab 3.2",
};

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function fmt(ts) {
  if (!ts) return "—";
  return ts.toDate().toLocaleString();
}

async function renderAdmin() {
  const el = document.getElementById("admin-content");

  try {
    const [profilesSnap, opensSnap, attemptsSnap] = await Promise.all([
      getDocs(collection(db, "profiles")),
      getDocs(collection(db, "labOpens")),
      getDocs(collection(db, "quizAttempts")),
    ]);

    if (profilesSnap.empty) {
      el.innerHTML = '<p class="error">No data returned. Either there are no students yet, or this account is not an admin (Firestore rules only return data to admins).</p>';
      return;
    }

    const opensByUser = {};
    opensSnap.forEach((d) => {
      const o = d.data();
      (opensByUser[o.userId] ||= []).push(o);
    });

    const attemptsByUser = {};
    attemptsSnap.forEach((d) => {
      const a = d.data();
      (attemptsByUser[a.userId] ||= []).push(a);
    });

    const rows = profilesSnap.docs.map((d) => {
      const uid = d.id;
      const p = d.data();
      const opens = (opensByUser[uid] || [])
        .map((o) => `<span class="pill">${escapeHtml(LAB_TITLES[o.labId] || o.labId)} · ${o.openCount || 1}× · ${fmt(o.lastOpenedAt)}</span>`)
        .join(" ") || '<span class="muted">none</span>';
      const attempts = (attemptsByUser[uid] || [])
        .map((a) => `<span class="pill">${escapeHtml(LAB_TITLES[a.labId] || a.labId)} (${escapeHtml(a.quizId)}): ${a.score}/${a.total}</span>`)
        .join(" ") || '<span class="muted">none</span>';
      return `<tr>
        <td>${escapeHtml(p.email)}${p.isAdmin ? ' <span class="pill">admin</span>' : ''}</td>
        <td>${opens}</td>
        <td>${attempts}</td>
      </tr>`;
    }).join("");

    el.innerHTML = `<table>
      <thead><tr><th>Student</th><th>Labs opened</th><th>Quiz attempts</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  } catch (err) {
    el.innerHTML = `<p class="error">Could not load admin data: ${escapeHtml(err.message)}. This page is only visible to accounts with <code>isAdmin: true</code> in Firestore.</p>`;
  }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../account/";
    return;
  }
  const snap = await getDoc(doc(db, "profiles", user.uid));
  if (!snap.exists() || snap.data().isAdmin !== true) {
    document.getElementById("admin-content").innerHTML =
      '<p class="error">Access denied — this account is not an admin.</p>';
    return;
  }
  renderAdmin();
});
</script>

</body>
</html>
