<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — SCADE Lab Portfolio</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0D1B3E;
      --blue: #1565C0;
      --sky: #1E88E5;
      --ice: #E3F2FD;
      --white: #FFFFFF;
      --off: #F5F7FA;
      --muted: #78909C;
      --gray: #455A64;
      --border: #D0D8E8;
      --green: #2E7D32;
      --orange: #F57C00;
      --font: 'Segoe UI', system-ui, sans-serif;
      --mono: 'Consolas', 'Fira Mono', monospace;
    }

    body {
      font-family: var(--font); font-size: 15px; color: var(--gray);
      background: var(--off); line-height: 1.65; min-height: 100vh;
    }

    .page-header {
      background: var(--navy); color: var(--white);
      padding: 2rem; border-bottom: 4px solid var(--sky);
    }
    .page-header h1 { font-size: 1.6rem; font-weight: 700; color: var(--white); }
    .back-btn {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: .8rem; font-weight: 600; color: #90A4AE;
      border: 1px solid #2A4A7F; border-radius: 5px;
      padding: .3rem .75rem; text-decoration: none;
      margin-bottom: .75rem; transition: color .15s, border-color .15s;
    }
    .back-btn:hover { color: var(--white); border-color: var(--sky); }

    .page-content { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.75rem; margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.05rem; font-weight: 700; color: var(--navy); margin-bottom: 1rem; }

    label { display: block; font-size: .82rem; font-weight: 600; color: var(--gray); margin: .75rem 0 .3rem; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; padding: .55rem .7rem; font-size: .9rem;
      border: 1px solid var(--border); border-radius: 6px; font-family: var(--font);
    }

    .btn {
      display: inline-block; font-size: .85rem; font-weight: 700; color: var(--white);
      background: var(--blue); border: none; border-radius: 6px;
      padding: .55rem 1.1rem; cursor: pointer; margin-top: 1rem; transition: background .15s;
    }
    .btn:hover { background: var(--sky); }
    .btn-secondary { background: transparent; color: var(--blue); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--ice); }

    .form-msg { font-size: .82rem; margin-top: .6rem; min-height: 1.2em; }
    .form-msg.error { color: #B71C1C; }
    .form-msg.ok { color: var(--green); }

    .auth-forms { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 600px) { .auth-forms { grid-template-columns: 1fr; } }

    table { width: 100%; border-collapse: collapse; font-size: .87rem; }
    th { background: var(--navy); color: var(--white); padding: .5rem .65rem; text-align: left; font-weight: 600; }
    td { padding: .5rem .65rem; border-bottom: 1px solid var(--border); }
    tr:nth-child(even) td { background: #F8FAFC; }

    .muted { color: var(--muted); font-size: .87rem; }
  </style>
</head>
<body>

<header class="page-header">
  <a class="back-btn" href="../">&#8592; All Labs</a>
  <h1>My Account</h1>
</header>

<main class="page-content">

  <section id="logged-out-view" class="card" style="display:none">
    <div class="auth-forms">
      <div>
        <h2>Log in</h2>
        <form id="login-form">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email" />
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password" />
          <button type="submit" class="btn">Log in</button>
          <p id="login-msg" class="form-msg"></p>
        </form>
      </div>
      <div>
        <h2>Register</h2>
        <form id="register-form">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" required autocomplete="email" />
          <label for="register-password">Password</label>
          <input type="password" id="register-password" required minlength="6" autocomplete="new-password" />
          <button type="submit" class="btn btn-secondary">Create account</button>
          <p id="register-msg" class="form-msg"></p>
        </form>
      </div>
    </div>
  </section>

  <section id="logged-in-view" style="display:none">
    <div class="card">
      <h2>Signed in as <span id="account-email"></span></h2>
      <button type="button" class="btn btn-secondary" id="logout-btn">Log out</button>
    </div>

    <div class="card">
      <h2>Labs opened</h2>
      <div id="lab-opens-table"><p class="muted">Loading…</p></div>
    </div>

    <div class="card">
      <h2>Quiz attempts</h2>
      <div id="quiz-attempts-table"><p class="muted">Loading…</p></div>
    </div>
  </section>

</main>

<script type="module">
import { auth, db } from "../assets/js/firebase-client.js";
import { ensureProfile } from "../assets/js/firebase-profile.js";
import {
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  collection, query, where, getDocs,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const LAB_TITLES = {
  lab2: "Lab 2 — Cruise Control Safety System",
  lab3_1: "Lab 3.1 — Combinatorial & Sequential Logic",
  lab3_2: "Lab 3.2 — Cruise Control Model & Car Simulation",
};

function fmt(ts) {
  if (!ts) return "—";
  return ts.toDate().toLocaleString();
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function loadProgress(user) {
  const opensSnap = await getDocs(query(collection(db, "labOpens"), where("userId", "==", user.uid)));
  const opensEl = document.getElementById("lab-opens-table");
  if (opensSnap.empty) {
    opensEl.innerHTML = '<p class="muted">No labs opened yet.</p>';
  } else {
    const rows = opensSnap.docs.map(d => {
      const o = d.data();
      return `<tr><td>${escapeHtml(LAB_TITLES[o.labId] || o.labId)}</td><td>${o.openCount || 1}</td><td>${fmt(o.lastOpenedAt)}</td></tr>`;
    }).join("");
    opensEl.innerHTML = `<table><thead><tr><th>Lab</th><th>Opens</th><th>Last opened</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  // No orderBy here on purpose: a where() + orderBy() on different fields
  // needs a Firestore composite index that doesn't exist by default. Sort
  // client-side instead — attempt volume per student is small.
  const attemptsSnap = await getDocs(
    query(collection(db, "quizAttempts"), where("userId", "==", user.uid))
  );
  const attemptsEl = document.getElementById("quiz-attempts-table");
  if (attemptsSnap.empty) {
    attemptsEl.innerHTML = '<p class="muted">No quiz attempts yet.</p>';
  } else {
    const attempts = attemptsSnap.docs.map(d => d.data())
      .sort((a, b) => (b.submittedAt?.toMillis() || 0) - (a.submittedAt?.toMillis() || 0));
    const rows = attempts.map(a =>
      `<tr><td>${escapeHtml(LAB_TITLES[a.labId] || a.labId)}</td><td>${escapeHtml(a.quizId)}</td><td>${a.score} / ${a.total}</td><td>${fmt(a.submittedAt)}</td></tr>`
    ).join("");
    attemptsEl.innerHTML = `<table><thead><tr><th>Lab</th><th>Quiz</th><th>Score</th><th>Submitted</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
}

onAuthStateChanged(auth, async (user) => {
  document.getElementById("logged-out-view").style.display = user ? "none" : "block";
  document.getElementById("logged-in-view").style.display = user ? "block" : "none";
  if (user) {
    document.getElementById("account-email").textContent = user.email;
    try {
      await ensureProfile(user);
    } catch (err) {
      console.error("Failed to load/create Firestore profile for", user.uid, err);
    }
    loadProgress(user);
  }
});

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("login-msg");
  msg.textContent = ""; msg.className = "form-msg";
  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("login-email").value,
      document.getElementById("login-password").value
    );
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "form-msg error";
  }
});

document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("register-msg");
  msg.textContent = ""; msg.className = "form-msg";
  try {
    await createUserWithEmailAndPassword(
      auth,
      document.getElementById("register-email").value,
      document.getElementById("register-password").value
    );
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "form-msg error";
  }
});

document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));
</script>

</body>
</html>
